{% extends "unfold/layouts/base_simple.html" %}
{% load i18n static %}

{% block extrastyle %}
    {{ block.super }}
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
{% endblock %}

{% block content %}
<div class="emenu-aurora fixed inset-0 pointer-events-none"></div>
<div class="min-h-screen flex items-center justify-center p-6 relative z-10">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 text-white text-2xl font-black"
                 style="background: linear-gradient(135deg, #6366f1, #a855f7); box-shadow: 0 8px 32px -4px rgba(99,102,241,0.5);">
                🍽️
            </div>
            <h1 class="text-2xl font-black text-gray-900 dark:text-white mb-1">E-Menu Pro</h1>
            <p class="text-sm text-gray-500">منصة إدارة المنيو الذكية</p>
        </div>

        <div class="glass-card-strong rounded-2xl p-8 bg-white dark:bg-gray-900">
            {% if form.errors %}
            <div class="mb-4 p-3 rounded-xl bg-red-50 text-red-700 text-sm font-bold">
                بيانات الدخول غير صحيحة
            </div>
            {% endif %}

            <form method="post" id="login-form">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">اسم المستخدم</label>
                    <input type="text" name="username" autofocus required
                           class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 dark:text-white focus:border-indigo-500 outline-none transition-colors">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">كلمة المرور</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 dark:text-white focus:border-indigo-500 outline-none transition-colors">
                </div>
                <button type="submit"
                        class="w-full py-3.5 rounded-xl font-black text-white transition-transform hover:scale-[1.02] active:scale-[0.98]"
                        style="background: linear-gradient(135deg, #6366f1, #a855f7); box-shadow: 0 4px 20px -4px rgba(99,102,241,0.5);">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
