<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>طلب مؤسسات</title></head>
<body style="font-family:sans-serif;padding:24px;background:#f8fafc;">
  <div style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:24px;border:1px solid #e2e8f0;">
    <h2 style="color:#6366f1;margin-top:0;">🏢 طلب خطة مؤسسات جديد</h2>
    <table style="width:100%;border-collapse:collapse;">
      <tr><td style="padding:8px 0;color:#64748b;">الاسم</td><td><strong>{{ contact.name }}</strong></td></tr>
      <tr><td style="padding:8px 0;color:#64748b;">البريد</td><td><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></td></tr>
      <tr><td style="padding:8px 0;color:#64748b;">الهاتف</td><td>{{ contact.phone|default:"—" }}</td></tr>
      <tr><td style="padding:8px 0;color:#64748b;">المؤسسة</td><td>{{ contact.company|default:"—" }}</td></tr>
      <tr><td style="padding:8px 0;color:#64748b;">التاريخ</td><td>{{ created_at }}</td></tr>
    </table>
    <div style="margin-top:20px;padding:16px;background:#f1f5f9;border-radius:8px;">
      <p style="margin:0 0 8px;color:#64748b;font-size:13px;">الرسالة:</p>
      <p style="margin:0;white-space:pre-wrap;">{{ contact.message }}</p>
    </div>
  </div>
</body>
</html>
