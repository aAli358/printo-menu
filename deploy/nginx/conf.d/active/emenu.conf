# E-Menu — Edge Nginx with TLS (wildcard *.printo-menu.com)
# Enable after obtaining certificates via deploy/scripts/setup-ssl.sh

upstream emenu_backend {
    server backend:8000;
}

upstream emenu_frontend {
    server frontend:80;
}

# HTTP → HTTPS redirect (+ ACME challenge)
server {
    listen 80;
    server_name printo-menu.com *.printo-menu.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name printo-menu.com *.printo-menu.com;

    ssl_certificate /etc/letsencrypt/live/printo-menu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printo-menu.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://emenu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://emenu_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://emenu_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        proxy_pass http://emenu_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        proxy_pass http://emenu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
